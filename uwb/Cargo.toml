[workspace]
resolver = "2"
members = [
  "protocol",
  "dwm3001",
  "dw1000",
  "dw1000/vendor/dw1000-rs",
]

[patch.crates-io]
# Mission 10 needs explicit delayed-radio deadlines, on-air timestamps, raw RX
# timestamps, and complete receive recovery. The local changes are documented
# in dw1000/vendor/dw1000-rs/MAAV.md.
dw1000-rs = { path = "dw1000/vendor/dw1000-rs" }

[profile.dev]
codegen-units = 1
debug = 2
incremental = false
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
